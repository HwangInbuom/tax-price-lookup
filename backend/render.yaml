services:
  - type: web
    name: tax-price-lookup
    runtime: python
    plan: free
    rootDir: backend
    buildCommand: "pip install -r requirements.txt"
    startCommand: "uvicorn main:app --host 0.0.0.0 --port $PORT"
    envVars:
      - key: KAKAO_REST_API_KEY
        sync: false
      - key: VWORLD_API_KEY
        sync: false
      - key: VWORLD_DOMAIN
        sync: false
      - key: PRICE_API_YEAR
        value: "2026"
      - key: PRICE_API_PREV_YEAR
        value: "2025"
      - key: DATA_GO_KR_SERVICE_KEY
        sync: false
